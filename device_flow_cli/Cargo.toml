[package]
name = "device_flow_cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rolxapp"
path = "src/main.rs"

[dependencies]
anyhow             = "1"
api                = { path = "../api" }
chrono             = "0.4"
clap               = { version = "4", features = ["derive", "env"] }
device_flow        = { path = "../device_flow" }
serde_json         = "1"
tokio              = { version = "1", features = ["rt-multi-thread", "macros"] }
toml               = "1.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

slint              = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
qrcode             = { version = "0.14", default-features = false }

[build-dependencies]
slint-build        = "1.18"

[features]
uncensored_logs = ["device_flow/uncensored_logs"]
