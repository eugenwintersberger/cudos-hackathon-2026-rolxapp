[package]
name = "device_flow_cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rolxapp"
path = "src/main.rs"

[dependencies]
anyhow             = "1"
clap               = { version = "4", features = ["derive", "env"] }
device_flow        = { path = "../device_flow" }
tokio              = { version = "1", features = ["rt-multi-thread", "macros"] }
toml               = "1.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

slint              = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"], optional = true }
qrcode             = { version = "0.14", default-features = false, optional = true }

[build-dependencies]
slint-build        = { version = "1.18", optional = true }

[features]
default = []
uncensored_logs = ["device_flow/uncensored_logs"]
# Small window with URL, code and QR code for `login device --ui`.
ui = ["dep:slint", "dep:qrcode", "dep:slint-build"]
