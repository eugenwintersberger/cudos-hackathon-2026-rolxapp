[package]
name = "device_flow"
version.workspace = true
edition.workspace = true

[dependencies]
base64           = { version = "0.23", optional = true }
chrono           = { version = "0.4", features = ["serde"] }
dirs             = { version = "7", optional = true }
open             = { version = "5", optional = true }
rand             = { version = "0.10", optional = true }
reqwest          = { version = "0.13", features = ["form", "json", "rustls"], default-features = false }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
sha2             = { version = "0.11", features = ["oid"], optional = true }
thiserror        = "2"
tokio            = { version = "1", features = ["time"] }
tracing          = "0.1"
toml             = { version = "1.1", optional = true }
urlencoding      = { version = "2", optional = true }

[features]
default = ["file-store", "browser-login"]
# `FileSessionStore`, `AppConfig::load` and `config_path` (needs a filesystem).
file-store = ["dep:dirs", "dep:toml"]
# Login in the local browser: OAuth 2.0 native app flow with PKCE and a loopback redirect server.
browser-login = [
    "dep:base64",
    "dep:open",
    "dep:rand",
    "dep:sha2",
    "dep:urlencoding",
    "tokio/io-util",
    "tokio/net",
]
uncensored_logs = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
